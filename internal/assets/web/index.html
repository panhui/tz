<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="轻量、实时的 Linux 服务器监控面板">
  <title>TZ · 服务器监控</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><span>TZ</span><em>服务器监控</em></div>
      <div class="top-actions"><span id="syncStatus" class="sync"><b></b>正在连接</span><button class="btn ghost" id="tokenBtn">管理令牌</button><button class="btn primary" id="addNodeBtn"><span>＋</span> 添加服务器</button></div>
    </header>

    <main>
      <section class="overview" aria-label="流量总览">
        <div class="intro"><p>全局概览</p><h1>所有节点，尽在掌握</h1><span id="overviewMeta">等待节点上报数据</span></div>
        <article class="stat lime"><div class="stat-icon">↑</div><div><span>当前上传</span><strong id="sumUpSpeed">—</strong><small>所有在线节点</small></div></article>
        <article class="stat blue"><div class="stat-icon">↓</div><div><span>当前下载</span><strong id="sumDownSpeed">—</strong><small>所有在线节点</small></div></article>
        <article class="stat violet"><div class="stat-icon">Σ</div><div><span>累计流量</span><strong id="sumTraffic">—</strong><small id="sumTrafficSub">上传 — · 下载 —</small></div></article>
      </section>

      <section class="workspace">
        <aside class="groups">
          <div class="section-head"><h2>分组</h2><button class="icon-btn" id="addGroupBtn" aria-label="添加分组">＋</button></div>
          <nav id="groupList"><button class="group active" data-group=""><span><i class="dot all"></i>全部服务器</span><b>0</b></button></nav>
          <div class="legend"><span><i class="dot online"></i>在线</span><span><i class="dot offline"></i>离线</span></div>
        </aside>

        <section class="servers">
          <div class="section-head list-head"><div><h2 id="listTitle">全部服务器</h2><p id="listMeta">0 台服务器</p></div><div class="search"><span>⌕</span><input id="search" type="search" placeholder="搜索名称或 IP" aria-label="搜索服务器"></div></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>服务器</th><th>运行时间</th><th>CPU</th><th>内存</th><th>存储</th><th>上传速度</th><th>下载速度</th><th>总上传</th><th>总下载</th><th></th></tr></thead>
              <tbody id="nodeRows"></tbody>
            </table>
            <div id="emptyState" class="empty" hidden><div>⌁</div><h3>还没有服务器</h3><p>添加第一台服务器，然后复制一键安装命令。</p><button class="btn primary" id="emptyAddBtn">添加服务器</button></div>
          </div>
        </section>
      </section>
    </main>
  </div>

  <dialog id="formDialog"><form method="dialog" id="entityForm"><div class="modal-head"><div><span id="modalKicker">服务器</span><h2 id="modalTitle">添加服务器</h2></div><button value="cancel" class="close" aria-label="关闭">×</button></div><div id="formFields"></div><div class="modal-actions"><button value="cancel" class="btn ghost">取消</button><button value="default" class="btn primary" id="saveBtn">保存</button></div></form></dialog>
  <dialog id="commandDialog"><div class="command-card"><div class="success-mark">✓</div><span>服务器已创建</span><h2>在目标服务器运行</h2><p>复制下面的命令，以 root 用户执行。探针会自动安装并开始上报。</p><div class="command"><code id="installCommand"></code><button id="copyCommand">复制</button></div><button class="btn primary wide" id="commandDone">完成</button></div></dialog>
  <div id="toast" role="status"></div>
  <script src="/app.js"></script>
</body>
</html>
